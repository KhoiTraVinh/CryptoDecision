global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # API Service — /metrics exposed by Kestrel via OTel Prometheus exporter
  - job_name: api-service
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  # Ingestion Service — /metrics/ exposed by PrometheusHttpListener on port 9090
  - job_name: ingestion-service
    static_configs:
      - targets: ["ingestion:9090"]
    metrics_path: /metrics

  # Processor Service — /metrics/ exposed by PrometheusHttpListener on port 9090
  - job_name: processor-service
    static_configs:
      - targets: ["processor:9090"]
    metrics_path: /metrics

  # Prediction Service (Python) — prometheus_client exposes /metrics on port 9091
  - job_name: prediction-service
    static_configs:
      - targets: ["prediction:9091"]
    metrics_path: /metrics

  # Alert Service — /metrics exposed by PrometheusHttpListener on port 9090
  - job_name: alert-service
    static_configs:
      - targets: ["alert:9090"]
    metrics_path: /metrics
