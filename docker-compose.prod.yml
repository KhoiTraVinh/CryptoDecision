# ─────────────────────────────────────────────────────────────────────────────
# Production overlay: pull prebuilt images instead of building on the host.
#
# Used as:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Why images and not a build on the host
# --------------------------------------
# This used to be a capacity argument: the EC2 target had two x86_64 cores that were
# fully occupied keeping three WebSocket feeds ingesting, Postgres aggregating and the
# bot evaluating, and a .NET multi-stage build took them away for minutes on every
# deploy -- the gap showing up afterwards as missing 15-minute buckets, which is what
# the strategy is actually waiting on.
#
# That argument expired on 2026-10-22. The target is now a 28-core machine at home
# that builds all four services in a couple of minutes with the stack running.
#
# What is left is the rollback argument, and it is the better one anyway: CI tags every
# image with a commit SHA and GHCR keeps them, so a rollback is IMAGE_TAG plus `up -d`.
# Building on the host makes rollback a git checkout plus a rebuild, and makes "which
# commit is running" a question about the working tree rather than about a tag.
#
# BUILD_PLATFORM still defaults to linux/amd64, which is what both the old instance and
# the new machine are -- NOT Graviton, whatever this comment used to say.
#
# IMAGE_TAG is set by the deploy workflow to the commit SHA. It defaults to `latest`
# so a hand-run `up -d` on the instance still works, but a pinned SHA is what CI
# deploys — `latest` cannot tell you which commit is actually running.
# ─────────────────────────────────────────────────────────────────────────────

services:
  ingestion:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/ingestion:${IMAGE_TAG:-latest}

  processor:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/processor:${IMAGE_TAG:-latest}

  bot:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/bot:${IMAGE_TAG:-latest}

  polymarket:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/polymarket:${IMAGE_TAG:-latest}
