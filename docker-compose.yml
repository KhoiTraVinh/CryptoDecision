name: cryptodecision

services:

  # ── Kafka (KRaft — no ZooKeeper) ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    mem_limit: 512m
    environment:
      KAFKA_HEAP_OPTS:                     "-Xmx256m -Xms128m"
      KAFKA_NODE_ID:                       1
      KAFKA_PROCESS_ROLES:                 broker,controller
      KAFKA_LISTENERS:                     PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:          PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS:      1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:     CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME:    PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:     "false"
      KAFKA_NUM_PARTITIONS:                3
      KAFKA_DEFAULT_REPLICATION_FACTOR:    1
      KAFKA_LOG_RETENTION_HOURS:           72
      KAFKA_LOG_SEGMENT_BYTES:             104857600
      KAFKA_NUM_NETWORK_THREADS:           2
      KAFKA_NUM_IO_THREADS:                4
      # Single-broker: internal topics must use replication-factor=1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:          1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:  1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:             1
      # Persist data in the named volume (not ephemeral /tmp/kafka-logs)
      KAFKA_LOG_DIRS:                      /var/lib/kafka/data
      CLUSTER_ID:                          "CryptoDecisionKraftCluster1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Topic initialization ──────────────────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # command must be a single-element list so Docker Compose does NOT
    # tokenize it — passing a plain string causes it to be word-split and
    # only the first token is used as the -c script (rest become $0, $1…).
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic binance.trade.btcusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic binance.trade.ethusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic binance.kline.1m.btcusdt --partitions 1 --replication-factor 1
        --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic binance.kline.1m.ethusdt --partitions 1 --replication-factor 1
        --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic predictions.btcusdt --partitions 1 --replication-factor 1
        --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic predictions.ethusdt --partitions 1 --replication-factor 1
        --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic okx.trade.btcusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic okx.trade.ethusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bybit.trade.btcusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bybit.trade.ethusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic coinbase.trade.btcusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic coinbase.trade.ethusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic kraken.trade.btcusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic kraken.trade.ethusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic alerts.notifications --partitions 1 --replication-factor 1
        --config retention.ms=604800000 &&
        echo All Kafka topics created successfully
    restart: "no"

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    mem_limit: 768m
    environment:
      POSTGRES_DB:       crypto
      POSTGRES_USER:     crypto
      POSTGRES_PASSWORD: crypto
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_bootstrap_schema.sql:/docker-entrypoint-initdb.d/001_bootstrap_schema.sql:ro
      - ./sql/002_partition_helpers.sql:/docker-entrypoint-initdb.d/002_partition_helpers.sql:ro
      - ./sql/003_app_users.sql:/docker-entrypoint-initdb.d/003_app_users.sql:ro
      - ./sql/004_add_exchange.sql:/docker-entrypoint-initdb.d/004_add_exchange.sql:ro
      - ./sql/005_bot_config.sql:/docker-entrypoint-initdb.d/005_bot_config.sql:ro
      - ./sql/009_price_alerts.sql:/docker-entrypoint-initdb.d/009_price_alerts.sql:ro
      - ./sql/010_bot_config_v2.sql:/docker-entrypoint-initdb.d/010_bot_config_v2.sql:ro
      - ./sql/011_bot_ai_config.sql:/docker-entrypoint-initdb.d/011_bot_ai_config.sql:ro
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c effective_cache_size=512MB
        -c work_mem=2MB
        -c maintenance_work_mem=32MB
        -c checkpoint_completion_target=0.9
        -c wal_level=replica
        -c max_wal_size=1GB
        -c random_page_cost=1.1
        -c track_activity_query_size=2048
        -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Grafana Tempo (distributed tracing backend) ───────────────────────────────
  # Start with: docker compose --profile observability up -d
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yml"]
    mem_limit: 384m
    profiles: ["observability"]
    volumes:
      - ./docker/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query UI / HTTP API
      - "4317:4317"   # OTLP gRPC (services export traces here)
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Prometheus (metrics scraper) ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    mem_limit: 256m
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"   # exposed on 9091 to avoid conflict with service metrics ports
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Grafana (dashboards) ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    mem_limit: 192m
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_FEATURE_TOGGLES_ENABLE:  traceqlEditor
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── IngestionService ──────────────────────────────────────────────────────────
  ingestion:
    build:
      context: ./src/CryptoDecision.IngestionService
      dockerfile: Dockerfile
    container_name: ingestion
    mem_limit: 256m
    ports:
      - "8081:8080"   # health endpoint
      - "9095:9090"   # Prometheus metrics scrape port (internal: 9090)
    environment:
      DOTNET_ENVIRONMENT:          Production
      Kafka__BootstrapServers:     kafka:9092
      Telemetry__TempoEndpoint:    "http://tempo:4317"
      # Binance uses public stream — no auth needed
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── ProcessorService ──────────────────────────────────────────────────────────
  processor:
    build:
      context: ./src/CryptoDecision.ProcessorService
      dockerfile: Dockerfile
    container_name: processor
    mem_limit: 256m
    ports:
      - "8082:8080"   # health endpoint
      - "9096:9090"   # Prometheus metrics scrape port (internal: 9090)
    environment:
      DOTNET_ENVIRONMENT:              Production
      Kafka__BootstrapServers:         kafka:9092
      ConnectionStrings__Postgres:     "Host=postgres;Port=5432;Database=crypto;Username=crypto;Password=crypto;Pooling=true;MinPoolSize=5;MaxPoolSize=50;"
      Telemetry__TempoEndpoint:        "http://tempo:4317"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── BotService (Trading Bot Worker — always runs, even in headless mode) ────
  bot:
    build:
      context: ./src
      dockerfile: CryptoDecision.BotService/Dockerfile
    container_name: bot
    mem_limit: 128m
    environment:
      DOTNET_ENVIRONMENT:              Production
      ConnectionStrings__Postgres:     "Host=postgres;Port=5432;Database=crypto;Username=crypto;Password=crypto;Pooling=true;MinPoolSize=2;MaxPoolSize=20;"
      Telemetry__TempoEndpoint:        "http://tempo:4317"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── AlertService (Price Alert Kafka Consumer) ─────────────────────────────────
  alert:
    build:
      context: ./src/CryptoDecision.AlertService
      dockerfile: Dockerfile
    container_name: alert
    mem_limit: 128m
    ports:
      - "8084:8080"   # health endpoint
      - "9097:9090"   # Prometheus metrics scrape port
    environment:
      DOTNET_ENVIRONMENT:              Production
      Kafka__BootstrapServers:         kafka:9092
      ConnectionStrings__Postgres:     "Host=postgres;Port=5432;Database=crypto;Username=crypto;Password=crypto;Pooling=true;MinPoolSize=2;MaxPoolSize=10;"
      Telemetry__TempoEndpoint:        "http://tempo:4317"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── ApiService ────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./src
      dockerfile: CryptoDecision.ApiService/Dockerfile
    container_name: api
    mem_limit: 256m
    profiles: ["ui"]
    ports:
      - "8080:8080"   # HTTP (health + /metrics + Swagger)
    environment:
      ASPNETCORE_ENVIRONMENT:          Production
      ConnectionStrings__Postgres:     "Host=postgres;Port=5432;Database=crypto;Username=crypto;Password=crypto;Pooling=true;MinPoolSize=2;MaxPoolSize=30;"
      Kafka__BootstrapServers:         kafka:9092
      Telemetry__TempoEndpoint:        "http://tempo:4317"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Ollama — local LLM runtime serving Qwen 2.5 7B ────────────────────────
  #
  # Resource note: qwen2.5:7b at the default Q4_K_M quantisation is ~4.7 GB on
  # disk and wants roughly 6-8 GB of RAM resident while loaded. mem_limit is set
  # above that with headroom for the KV cache; lowering it will get the model
  # OOM-killed mid-generation rather than making it run leaner. If the host
  # cannot spare that, set OLLAMA_ENABLED=false on the prediction service and the
  # ensemble runs on the quantitative models alone.
  #
  # GPU: uncomment the deploy block below on a machine with an NVIDIA GPU and the
  # container toolkit installed. On CPU a generation takes ~20-60s, which is fine
  # against a 5-minute prediction interval.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    mem_limit: 10g
    environment:
      # Keep the model resident between prediction cycles. The default 5m would
      # unload it between runs and pay the multi-second load cost every time.
      OLLAMA_KEEP_ALIVE:        "30m"
      # One model, one request at a time — bounds peak memory predictably.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL:      "1"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      # `ollama list` talks to the local API, so it proves the server is serving.
      # The image has no wget/curl, so an HTTP probe is not available here.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── One-shot model pull ───────────────────────────────────────────────────
  # Downloads qwen2.5:7b into the shared volume on first boot (~4.7 GB) and exits.
  # Nothing blocks on it: the prediction service degrades to quantitative-only
  # while the pull runs and picks the LLM up automatically once it lands.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    # Single-element list so Compose does not word-split the script — same
    # reasoning as kafka-init above.
    command:
      - >-
        ollama pull qwen2.5:7b
    volumes:
      - ollama_models:/root/.ollama
    restart: "no"

  # ── PredictionService ─────────────────────────────────────────────────────
  prediction:
    build:
      context: ./src/CryptoDecision.PredictionService
      dockerfile: Dockerfile
    container_name: prediction
    # Raised from 128m: the service now builds richer market contexts and holds
    # prompt/response strings. Inference itself lives in the ollama container.
    mem_limit: 256m
    ports:
      - "8083:8080"   # health endpoint
      - "9094:9091"   # Prometheus metrics (prometheus_client default port)
    environment:
      POSTGRES_URL:             "postgresql://crypto:crypto@postgres:5432/crypto"
      KAFKA_BOOTSTRAP_SERVERS:  "kafka:9092"
      SYMBOLS:                  "BTCUSDT,ETHUSDT"
      PREDICTION_INTERVAL_SECONDS: "300"
      CONTEXT_HISTORY_DAYS:     "7"

      # ── LLM (Ollama / Qwen 2.5) ──
      # Set OLLAMA_ENABLED=false to run the ensemble on XGBoost + heuristic only.
      OLLAMA_ENABLED:           "true"
      OLLAMA_BASE_URL:          "http://ollama:11434"
      OLLAMA_MODEL:             "qwen2.5:7b"
      OLLAMA_TIMEOUT_SECONDS:   "120"
      OLLAMA_TEMPERATURE:       "0.2"
      OLLAMA_NUM_CTX:           "8192"
      OLLAMA_SEED:              "42"

      # ── Ensemble weights (renormalised over whichever models answer) ──
      ENSEMBLE_WEIGHT_LLM:       "0.35"
      ENSEMBLE_WEIGHT_XGBOOST:   "0.35"
      ENSEMBLE_WEIGHT_HEURISTIC: "0.30"
      # |score| below this is reported NEUTRAL rather than a weak directional call.
      ENSEMBLE_DEAD_ZONE:        "0.15"
    volumes:
      - prediction_models:/app/models
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # Deliberately service_started, not service_healthy: predictions should not
      # wait on a multi-gigabyte model pull. The LLM joins the ensemble on its own
      # once it answers an availability probe.
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Dashboard (nginx static + API proxy) ──────────────────────────────────
  dashboard:
    image: nginx:1.25-alpine
    container_name: dashboard
    profiles: ["ui"]
    ports:
      - "8888:80"
    volumes:
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/style.css:/usr/share/nginx/html/style.css:ro
      - ./dashboard/app.js:/usr/share/nginx/html/app.js:ro
      - ./dashboard/docs.html:/usr/share/nginx/html/docs.html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Cloudflare Tunnel — HTTPS ra ngoài (4G / WiFi khác), không cần port forwarding ──
  # Chạy: docker compose --profile tunnel up -d cloudflared
  # Lấy URL: docker compose logs cloudflared | grep "trycloudflare.com"
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --url http://dashboard:80
    depends_on:
      dashboard:
        condition: service_healthy
    profiles:
      - tunnel   # chỉ chạy khi: docker compose --profile tunnel up -d

volumes:
  kafka_data:
  postgres_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  prediction_models:
  # Holds the downloaded Qwen 2.5 weights (~4.7 GB). Persisting this across
  # `docker compose down` is what keeps the re-pull from happening every restart.
  ollama_models:
