name: cryptodecision

# Docker's json-file driver keeps every line a container has ever written, with no
# limit unless one is set here. Measured on the running host: 858 MB of container logs
# after three days, 649 MB of it the processor alone at ~215 MB/day, growing without
# bound. It has never filled the disk only because every deploy recreates the
# containers and starts the files over — which is luck, not a policy.
#
# 50m x 3 caps the whole stack at roughly 1.8 GB and keeps about a day of processor
# history, which is longer than the window any incident here has needed.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ── Kafka (KRaft — no ZooKeeper) ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    logging: *default-logging
    # Without this, Docker defaults to "no" and kafka does NOT come back after a
    # host reboot or a daemon restart, while every unless-stopped service does.
    # The bot then runs against a stack that is missing its backbone and looks
    # like a bot fault. Same reason as postgres below.
    restart: unless-stopped
    ports:
      - "9092:9092"
    mem_limit: 512m
    environment:
      KAFKA_HEAP_OPTS:                     "-Xmx256m -Xms128m"
      KAFKA_NODE_ID:                       1
      KAFKA_PROCESS_ROLES:                 broker,controller
      KAFKA_LISTENERS:                     PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:          PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS:      1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:     CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME:    PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:     "false"
      KAFKA_NUM_PARTITIONS:                3
      KAFKA_DEFAULT_REPLICATION_FACTOR:    1
      KAFKA_LOG_RETENTION_HOURS:           72
      KAFKA_LOG_SEGMENT_BYTES:             104857600
      KAFKA_NUM_NETWORK_THREADS:           2
      # 2, not 4. On a 2-vCPU host four IO threads oversubscribe the box and the JVM
      # spends time context-switching rather than doing work. Throughput here is one
      # symbol at ~28 trades/sec, which one thread would carry.
      KAFKA_NUM_IO_THREADS:                2
      # Single-broker: internal topics must use replication-factor=1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:          1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:  1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:             1
      # Persist data in the named volume (not ephemeral /tmp/kafka-logs)
      KAFKA_LOG_DIRS:                      /var/lib/kafka/data
      CLUSTER_ID:                          "CryptoDecisionKraftCluster1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Topic initialization ──────────────────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # command must be a single-element list so Docker Compose does NOT
    # tokenize it — passing a plain string causes it to be word-split and
    # only the first token is used as the -c script (rest become $0, $1…).
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic binance.trade.solusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic binance.kline.1m.solusdt --partitions 1 --replication-factor 1
        --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic okx.trade.solusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bybit.trade.solusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        echo All Kafka topics created successfully
    restart: "no"

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    logging: *default-logging
    # The whole stack is downstream of this. With no policy Docker defaults to
    # "no", so a reboot brings back bot, processor and ingestion but not their
    # database -- the worst possible half-recovery for an unattended bot.
    restart: unless-stopped
    ports:
      - "5432:5432"
    # Raised from 768m. Postgres is the workhorse here and the only service whose
    # performance is cache-sensitive; with a 7-day trades window (~2.5 GB) more page
    # cache is the highest-value gigabyte in the budget.
    mem_limit: 1g
    environment:
      # Parameterised so the value in .env is the value in force. It was hardcoded to
      # `crypto` here while db-migrate connected with ${POSTGRES_PASS} from .env — so
      # setting that secret broke the migration with psql exit 2 (connection failed)
      # and changed nothing else, because every other client hardcoded `crypto` too.
      #
      # initdb reads these ONLY when the data volume is empty. Changing the password
      # against an existing volume does not change the database password: the volume
      # has to be recreated, or this set back to what the volume was built with.
      POSTGRES_DB:       "${POSTGRES_DB:-crypto}"
      POSTGRES_USER:     "${POSTGRES_USER:-crypto}"
      POSTGRES_PASSWORD: "${POSTGRES_PASS:-crypto}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c effective_cache_size=512MB
        -c work_mem=2MB
        -c maintenance_work_mem=32MB
        -c checkpoint_completion_target=0.9
        -c wal_level=replica
        -c max_wal_size=1GB
        -c random_page_cost=1.1
        -c track_activity_query_size=2048
        -c log_min_duration_statement=1000
    healthcheck:
      # Interpolated by Compose, not by the container shell. A $-escaped variable
      # here would have to survive two layers of escaping, and it did not — it
      # collapsed to a single $ and Compose resolved it to an empty string, giving
      # `pg_isready -U ""`. That fails, postgres never reports healthy, and every
      # service that waits on it never starts. Same source of truth either way.
      # pg_isready, not a query.
      #
      # It is tempting to make this authenticate — a password mismatch leaves postgres
      # reporting healthy while every client fails to log in, and the first symptom is
      # "container processor is unhealthy" three services downstream. But a healthcheck
      # running inside this container cannot test that: the official image's pg_hba
      # grants `trust` to local-socket and loopback connections, so psql succeeds here
      # whatever the password is. A check that always passes is worse than one with a
      # known blind spot.
      #
      # The credentials are verified where they can be — db-migrate connects over TCP
      # from another container and therefore actually authenticates. See sql/migrate.sh.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto} -d ${POSTGRES_DB:-crypto}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Credential canary ─────────────────────────────────────────────────────
  #
  # Verifies that the configured credentials actually log in, before anything else
  # starts. Depends on postgres alone, so it has no schema prerequisites and cannot
  # be blocked by the services it protects.
  #
  # This exists because the diagnostic was previously unreachable. A password
  # mismatch — the most likely reason the database is unusable, since
  # POSTGRES_PASSWORD only applies to an empty volume — failed first inside
  # ProcessorService, and the operator saw "container processor is unhealthy" with
  # nothing about credentials. The clear message lived in db-migrate, which waits on
  # processor, so it never ran.
  #
  # The postgres healthcheck cannot cover this: the official image grants `trust` to
  # local-socket and loopback connections, so a query run inside that container
  # succeeds whatever the password is. This container connects over TCP.
  db-check:
    image: postgres:16
    container_name: db-check
    logging: *default-logging
    mem_limit: 64m
    environment:
      PGHOST:     postgres
      PGPORT:     "5432"
      PGUSER:     "${POSTGRES_USER:-crypto}"
      PGPASSWORD: "${POSTGRES_PASS:-crypto}"
      PGDATABASE: "${POSTGRES_DB:-crypto}"
      SQL_DIR:    /sql
      # Same script as db-migrate, stopping after the credential check. One script so
      # the two cannot disagree about what a working connection is.
      CHECK_ONLY: "1"
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/sh", "/sql/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Schema migrations ─────────────────────────────────────────────────────
  #
  # Applies sql/*.sql in filename order, once each, recorded in schema_migrations.
  #
  # This replaces docker-entrypoint-initdb.d, which could not do the job: Postgres
  # runs that directory only when the data volume is empty, so it never applied
  # anything on an upgrade, and the mount list stopped at 011. Migrations 012-022 —
  # flow_bars_15m, per-trade exit geometry, the entry cap, risk-based sizing, both
  # readiness views — were applied by hand to one machine. A fresh instance would
  # have started, reported healthy, and abstained forever against a table that did
  # not exist.
  #
  # Every service that touches the database waits on this completing successfully.
  db-migrate:
    image: postgres:16
    container_name: db-migrate
    logging: *default-logging
    mem_limit: 128m
    environment:
      PGHOST:     postgres
      PGPORT:     "5432"
      PGUSER:     "${POSTGRES_USER:-crypto}"
      PGPASSWORD: "${POSTGRES_PASS:-crypto}"
      PGDATABASE: "${POSTGRES_DB:-crypto}"
      SQL_DIR:    /sql
      # Set to 1 exactly once, against a database already migrated by hand, to record
      # the existing files without re-running them. Never against an empty database —
      # it would produce a ledger claiming a schema that does not exist.
      MIGRATE_BASELINE: "${MIGRATE_BASELINE:-0}"
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/sh", "/sql/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      # Waits for ProcessorService, which owns the base schema.
      #
      # DatabaseInitializer creates trades, klines_1m, daily_feature_table,
      # prediction_table, bot_trades and the bot_config columns, and it runs before
      # host.RunAsync() — so a healthy processor means those tables exist. The sql/
      # files are increments on top of that and several of them (006 onward) alter
      # tables they do not create.
      processor:
        condition: service_healthy
    restart: "no"

  # ── IngestionService ──────────────────────────────────────────────────────────
  ingestion:
    build:
      context: ./src/CryptoDecision.IngestionService
      dockerfile: Dockerfile
    container_name: ingestion
    logging: *default-logging
    mem_limit: 256m
    ports:
      - "8081:8080"   # health endpoint
    environment:
      DOTNET_ENVIRONMENT:          Production
      Kafka__BootstrapServers:     kafka:9092
      # Binance uses public stream — no auth needed
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      # Gated on the credential canary so a bad password reports itself instead of
      # surfacing here as an unhealthy container with a stack trace.
      db-check:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── ProcessorService ──────────────────────────────────────────────────────────
  processor:
    build:
      context: ./src/CryptoDecision.ProcessorService
      dockerfile: Dockerfile
    container_name: processor
    logging: *default-logging
    mem_limit: 256m
    ports:
      - "8082:8080"   # health endpoint
    environment:
      DOTNET_ENVIRONMENT:              Production
      Kafka__BootstrapServers:         kafka:9092
      ConnectionStrings__Postgres:     "Host=postgres;Port=5432;Database=${POSTGRES_DB:-crypto};Username=${POSTGRES_USER:-crypto};Password=${POSTGRES_PASS:-crypto};Pooling=true;MinPoolSize=5;MaxPoolSize=50;"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── BotService (Trading Bot Worker — always runs, even in headless mode) ────
  bot:
    build:
      context: ./src
      dockerfile: CryptoDecision.BotService/Dockerfile
    container_name: bot
    logging: *default-logging
    # Raised from 128m. The process was steady at 92 MB against that cap — 72%, with
    # no headroom for a GC to work in — and stalled with every thread in futex_wait.
    # 256m matches the other .NET services here and is still small; the GC mode was
    # the larger half of that problem and is fixed in the csproj.
    mem_limit: 256m
    environment:
      DOTNET_ENVIRONMENT:              Production
      ConnectionStrings__Postgres:     "Host=postgres;Port=5432;Database=${POSTGRES_DB:-crypto};Username=${POSTGRES_USER:-crypto};Password=${POSTGRES_PASS:-crypto};Pooling=true;MinPoolSize=2;MaxPoolSize=20;"

      # ── OKX live order placement ──
      #
      # Credentials come from the host environment or a .env file and are never
      # written into this file — it is committed, they are not.
      #
      # Okx__EnableLiveTrading is the arm switch and defaults to false, so a
      # deployment that has credentials still cannot place an order until this is
      # deliberately set. bot_config.paper_mode=false is the second, separate
      # switch. Okx__DemoTrading=true routes every order to OKX's simulated
      # account, which is where a new configuration belongs first.
      Okx__ApiKey:                     "${OKX_API_KEY:-}"
      Okx__ApiSecret:                  "${OKX_API_SECRET:-}"
      Okx__Passphrase:                 "${OKX_PASSPHRASE:-}"
      Okx__DemoTrading:                "${OKX_DEMO_TRADING:-true}"
      Okx__EnableLiveTrading:          "${OKX_ENABLE_LIVE_TRADING:-false}"
      Okx__MaxOrderNotionalUsd:        "${OKX_MAX_ORDER_NOTIONAL_USD:-100}"
      Okx__Leverage:                   "${OKX_LEVERAGE:-3}"
      Okx__MarginMode:                 "${OKX_MARGIN_MODE:-isolated}"

      # ── H36: TargetRiskMultiple 2.0 -> 1.0, 2026-10-08 ──────────────────────
      #
      # The stop is a flat 2.00% in practice — 1.5 x ATR has never once beaten the
      # H8 floor in 124 trades (ATR at entry ranges 0.138-0.936%, so 1.5x tops out at
      # 1.404% against a 2.00% floor; it would need 1.333% ATR to bind). So the
      # target is 2.0 x 2.00% = 4.00%, and the "dynamic" geometry has never moved.
      #
      # Gridded on real minute paths, 120 bracketed trades, first touch inside 12h,
      # net of the 0.070% round trip. Where both legs are touched in the same minute
      # the adverse one is assumed first, because the optimistic version is how a
      # replay invents an edge:
      #
      #     TP      TP first   SL first   neither   net/decided trade
      #     0.75%      74         30        16        -0.113
      #     1.50%      50         39        31        -0.104
      #     2.00%      39         40        41        -0.095   <- best
      #     2.50%      26         40        54        -0.297
      #     4.00%       8         41        71        -1.090   <- shipped
      #
      # NO CELL IS POSITIVE. This is damage reduction, not an edge: ~1.0 percentage
      # point per bracket-decided trade, moving off the worst cell of the nine.
      #
      # 1.50-2.00% is a plateau (-0.104/-0.106/-0.095) rather than a spike, and it
      # falls off a cliff past 2.00%. Separately, 2.00% is where touch probability
      # equals the stop's — measured on a different day by a different method, same
      # answer. Two agreeing measurements on a plateau is the opposite of picking an
      # argmax off a short curve, which this repository has done before.
      #
      # MinRewardRisk 0.5 still clears: 2%/2% is 0.93:1 after fees.
      #
      # ── H45: 2.0 -> 0.75. The 4% target has never once been touched. ────────
      #
      # At the 2.00% stop floor, 2.0x stored a 4.00% target, and use_dynamic_tp_sl
      # made its real level 6.67%. Maximum favourable excursion inside the hold,
      # measured on all 172 closed trades off klines_1m:
      #
      #     median 0.69%   p75 1.27%   p90 1.86%   MAX 3.94%
      #
      # The best trade this book has ever produced did not reach 4%. Share of trades
      # that touch a given target at any point before the hold expires:
      #
      #     1.0% -> 37.2%    2.0% -> 8.7%    3.0% -> 1.7%    4.0% -> 0%    6.67% -> 0%
      #
      # The target was not high, it was unreachable: a level no trade in the sample
      # has ever printed cannot fire, so TP was decorative and every position was
      # exiting on the stop or the 3h cap. 0.75 x 2.00% = 1.50%, which 18.0% of
      # trades touch.
      #
      # Gridded in PERCENT space, net of the 0.1% round trip, 180m hold, totals in R:
      #
      #              tp0.5    tp0.75   tp1.0    tp1.5    tp2.0    tp3.0
      #     stop 0.8  -23.01   -19.18   -14.49   -16.97   -19.57   -19.26
      #     stop 1.0  -25.54   -24.25   -18.90   -20.46   -22.56   -22.31
      #     stop 1.5  -18.51   -18.15   -14.21   -13.17   -13.73   -14.91
      #     stop 2.0  -14.37   -15.06   -11.98   -10.73   -11.13   -12.01
      #
      # Best cell is stop 2.00% / target 1.50%, and the 1.0-2.0% target band is a
      # plateau rather than a spike. MinRewardRisk 0.5 still clears: 1.5%/2.0% is
      # 0.70:1 after fees.
      DipStrategy__TargetRiskMultiple:  "${TARGET_RISK_MULTIPLE:-0.75}"
      FlowStrategy__TargetRiskMultiple: "${TARGET_RISK_MULTIPLE:-0.75}"
      #
      # ── H42: target back to 2.0R, ratchet OFF, max hold 3h. 2026-10-16 ─────
      #
      # Reverts H36 and switches off H25. The three are one change: a 2R target needs
      # the position left alone long enough to reach it, and "left alone" is only safe
      # with a hold cap that stops a position drifting for half a day.
      #
      # THE HOLD CAP IS THE PARAMETER THAT MATTERED, and it was not being varied when
      # the first version of this was measured and rejected. Replayed on klines_1m over
      # all 172 closed trades, stop/target only, no ratchet, max hold down the side and
      # target multiple across:
      #
      #              1.0R     1.5R     2.0R     2.5R     3.0R
      #     60m     +2.04    +1.14    +1.64    +1.08    +1.08
      #     120m    -5.51    -7.94    -7.62    -7.12    -6.62
      #     180m    -3.12    -3.00    -1.33    -0.33    +0.27
      #     240m    -4.27    -7.63    -5.13    -3.70    -5.05
      #     720m   -10.52   -10.68    -7.46    -7.51   -11.09
      #
      # Deployed before this change -- 720m hold, 1.0R target, ratchet ON -- replays at
      # -5.37R. The operator's configuration, 180m and 2.0R with the ratchet off, is
      # -1.33R on the same 172 trades. The ratchet is worth +5.17R at a 12-hour hold and
      # is a LIABILITY once the hold is capped: at 180m it turns -1.33R into -6.27R,
      # because what it was protecting against was a position drifting for hours.
      #
      # THE GRID IS ERRATIC AND IS NOT BEING FITTED. 120m is deeply negative between two
      # rows that are not, and no column is monotone. What survives reading is the
      # direction -- shorter holds beat longer ones at every target -- not any cell.
      # 60m is the only row positive across all five multiples and is NOT taken: it is
      # one row, the waiver path is already pinned at 60 so that row partly measures
      # itself, and 3h is the operator's call.
      #
      # max_hold_minutes 720 -> 180 is a bot_config edit, not here. Both must move
      # together or this is a 2R target with 12 hours to drift, which is the -7.46 cell.
      DipStrategy__UseRatchetExit:      "${USE_RATCHET_EXIT:-false}"
      FlowStrategy__UseRatchetExit:     "${USE_RATCHET_EXIT:-false}"

      # ── H44: no early exit at all, and a 0.80% dip. 2026-10-16 ─────────────
      #
      # Operator decision, taken against both measurements below. They are recorded in
      # HYPOTHESES.md as H43 and H44 so the week is judged on what was known, not on
      # what is remembered.
      #
      # UseFlowOfiExit=false is what leaves a position with no early exit at all.
      #
      # It used to mean more than that. The switch sat ABOVE an exit reviewer in
      # ClassifyExit, so turning it off removed the model review AND the OFI rule
      # together -- they were not independent, and dropping only the reviewer was
      # not reachable from configuration. The reviewer is gone from the code now
      # (it closed 30 positions for -$3.74 as LLM_EXIT), so this switch means the
      # plain thing again: true runs the OFI rule every cycle, false runs nothing.
      #
      # With it false, what closes a position is the stop, the target, and the 3h
      # max hold. Nothing else.
      #
      # That is exactly the configuration H42 replayed at -1.33R, the best cell in its
      # grid, because that replay contained no early exit either. So this change moves
      # the live system ONTO the thing that was measured rather than away from it.
      #
      # What it gives up, measured: the reviewer was worth +0.323R over 53 exits across
      # the book and +1.37R over the 6 since H39 -- it loses money in dollars but loses
      # LESS than holding those same positions would have. OFI_REVERSAL goes with it, and
      # that one was worth -3.923R: 31 exits taking +5.395R where holding to stop or
      # target returned +9.318R. Net of the two, removing both is roughly neutral to
      # positive on the book as measured, and the 3h hold now does the job both were
      # doing badly.
      #
      # ReversalDropPct 0.60 -> 0.80 on DipStrategy ONLY. FlowStrategy is FlowRatio mode
      # and never reads a price threshold, so setting it there would be noise, not
      # symmetry -- which is why this one line breaks the both-sections convention H33
      # set for parameters both strategies actually read.
      #
      # H43 MEASURED THIS AND IT GOES THE OTHER WAY. On the 102 closed LONG dip trades,
      # bucketed by the fall each actually entered on:
      #
      #     0.60-0.80%   n 49   +0.0946 mean R   +4.634 total
      #     0.80-1.00%   n 25   -0.0393          -0.983
      #     1.00-1.50%   n 21   -0.0963          -2.022
      #     >= 1.50%     n  7   -0.1176          -0.823
      #
      # Raising the floor to 0.80 deletes the 49 trades carrying +4.634R and keeps the
      # three bands that lose. Crossed with H40's volume cap, the cell being deleted is
      # the best one in the book: small falls in quiet tape, 44 trades, +0.1259 mean R.
      # The operator has the table and chose the threshold anyway.
      DipStrategy__Signal__ReversalDropPct: "${DIP_REVERSAL_DROP_PCT:-0.80}"
      DipStrategy__UseFlowOfiExit:          "${USE_FLOW_OFI_EXIT:-false}"
      FlowStrategy__UseFlowOfiExit:         "${USE_FLOW_OFI_EXIT:-false}"

      # ── H34: ratchet giveback 40% -> 25% ────────────────────────────────────
      #
      # Measured 2026-10-06 on the 16 LIVE trades: winners keep 60.5% of their own
      # best excursion, which is exactly 1 - 0.40 and so is this parameter, not luck.
      # Avg win +0.503% against avg loss -0.616% needs a 55.0% win rate to break even
      # and the bot delivers 50.0%.
      #
      # Holding peaks fixed, 75% capture would lift the average win to ~0.642% and
      # drop the break-even rate to 49.0%. That is an UPPER BOUND, not a forecast: a
      # tighter trail also cuts some positions before they reach the peak they would
      # have reached, and nothing here measures that. The 40/50/60 grid on
      # RatchetGivebackPct never tested a cell below 40, so this is an untested cell.
      # H34 REJECTED 2026-10-08 at 11 trades. Back to 0.40.
      #
      # The parameter worked: capture against peak_price went 57.1% -> 66.1%, which is
      # 88% of the theoretical effect. It is the dollars that did not follow. RATCHET
      # went from 5 trades at +0.6071 to 6 at +0.5708, mean R 0.2024 -> 0.1586 — count
      # up, total down, which is verbatim the failure the entry said to watch for. A
      # tighter trail keeps a larger share of a peak it reaches sooner, and the share
      # is not what pays.
      #
      # Judged at 11 of the stated 25 on the operator's call, recorded as the
      # stopping-rule violation it is. Full result, including three defects in the
      # decision rule itself, is under "H34 — RESULT" in HYPOTHESES.md.
      DipStrategy__RatchetGivebackPct:  "${RATCHET_GIVEBACK:-0.40}"
      FlowStrategy__RatchetGivebackPct: "${RATCHET_GIVEBACK:-0.40}"

      # ── H40: the dip rule stands aside in heavy tape, 2026-10-16 ────────────
      #
      # DipStrategy ONLY. FlowStrategy is the waiver, whose entire trigger is this same
      # volume; capping it there would switch the strategy off.
      #
      # CANDLE_REVERSAL reads price and nothing else, so it cannot tell a dip from the
      # first leg of a flush. Mean R over all 116 closed dip trades, by notional in the
      # 30 minutes before entry:
      #
      #     < $10M   n 36   +0.0754        $20-40M   n 24   -0.0336
      #     $10-20M  n 43   +0.0374        >= $40M   n 13   -0.2106
      #
      # Monotone across four buckets with no cell out of order. On the 15-minute window
      # the bot reads live, the trades above the cap total negative R in BOTH sample
      # halves at every threshold from $8M to $20M — ten cells, ten negative. At $10M it
      # removes 31 of 116 entries carrying -4.720R and leaves 85 carrying +5.496R.
      #
      # $10M IS NOT AN OPTIMUM. The curve is monotone, so its argmax is simply the most
      # aggressive setting available and the data cannot choose. $10M is half the
      # news-print threshold and near the median entry; it thins the rule by about a
      # quarter instead of gutting it. Set to 0 to remove the cap entirely.
      DipStrategy__Signal__MaxEntryVolumeUsd: "${DIP_MAX_ENTRY_VOLUME_USD:-10000000}"

    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Polymarket esports entry bot ────────────────────────────────────────────
  #
  # Independent of everything above it: no Postgres, no Kafka. It talks
  # only outbound to Gamma, the CLOB and the Data API, and keeps its state on the
  # exchange rather than on disk, so it can be started and stopped on its own.
  #
  # Polymarket__DryRun defaults to TRUE. It scans, decides and logs, and sends
  # nothing. That is the arm switch; the private key alone does not arm it.
  polymarket:
    build:
      context: ./src
      dockerfile: CryptoDecision.PolymarketService/Dockerfile
    container_name: polymarket
    logging: *default-logging
    # 1g, not the 256m this started on. The scan parses Gamma event pages, and one page of
    # 100 football events carries about fifty markets each - six to eight megabytes of JSON
    # - across seventeen competition tags. At 256m that threw OutOfMemoryException mid-scan
    # and silently dropped every football page after the first, which is the worst kind of
    # failure here: the bot kept running and just stopped seeing most of the market.
    # Measured 277 MB in steady state, so this is roughly 3.5x headroom.
    mem_limit: 1g
    environment:
      DOTNET_ENVIRONMENT:          Production

      # ── Wallet. Never written into this file; it is committed, these are not. ──
      # PrivateKey is the key of the self-custody wallet (OKX Web3 Wallet), and
      # FunderAddress is the Polymarket wallet address from the Deposit page —
      # NOT the OKX wallet address. Getting those two out of step is the single
      # most likely way for every order to be rejected.
      Polymarket__PrivateKey:      "${POLY_PRIVATE_KEY:-}"
      Polymarket__FunderAddress:   "${POLY_FUNDER_ADDRESS:-}"
      Polymarket__SignatureType:   "${POLY_SIGNATURE_TYPE:-2}"

      # The arm switch. Leave true until a preflight run has printed the right
      # holder address, a non-zero USDC balance and a non-zero allowance.
      Polymarket__DryRun:          "${POLY_DRY_RUN:-true}"

      Polymarket__EntryPricesCsv:  "${POLY_ENTRY_PRICES:-}"
      Polymarket__StakeUsd:        "${POLY_STAKE_USD:-0.20}"
      Polymarket__MaxDailyUsd:     "${POLY_MAX_DAILY_USD:-15}"
      Polymarket__MinVolumeUsd:    "${POLY_MIN_VOLUME_USD:-25000}"
      Polymarket__ScanIntervalSeconds: "${POLY_SCAN_SECONDS:-5}"
      # Giu true. Tach dong tien cua @greenworld theo so phe nam trong mot market:
      # 25 market om ca hai phe @1c tra ve +$3.243, con 2.139 market chi mot phe lo
      # $1.962. Om ca hai phe o 1c la cam chac ben thang voi gia ~2c.
      Polymarket__RestBothSides:   "${POLY_REST_BOTH_SIDES:-true}"
      # ── THE POLYMARKET DEFAULTS ON THIS BLOCK ARE LIVE. Do not "align" them. ──
      #
      # Polymarket geo-blocks the production region, so the instance that actually
      # rests orders is the LOCAL one. Local has no deploy workflow writing a .env,
      # which means `${VAR:-default}` falls through to the default on each line --
      # these numbers are the running configuration, not documentation of it.
      #
      # The same lines in .github/workflows/deploy.yml are the opposite: that file
      # writes ~/cryptodecision/.env on the production host, where the service is
      # blocked and places nothing. So when the two disagree, THIS file is the one
      # that trades, and an edit here changes real behaviour today.
      #
      # 0.10 was briefly changed to 0.07 on 2026-10-16 on exactly the wrong reading
      # of that precedence -- treating production as authoritative and this as dead
      # text. Reverted the same day. Left here as the reason not to repeat it.
      # Nguong arm. ArmBelowAsk la gia tri du phong cho mon khong khai bao rieng; gia tri
      # tinh theo DONG nen 1.0 = 100 xu = vao ngay, KHONG phai 1 xu. Muc lenh nam cho la
      # Polymarket__EntryPricesCsv.
      Polymarket__ArmBelowAsk:          "${POLY_ARM_BELOW_ASK:-0.09}"
      Polymarket__ArmBelowAskByGameCsv: "${POLY_ARM_BY_GAME:-}"

      # Bong da. Do tren 1.570 token cua 806 market da dong: cua thua chi xuong toi 1c o
      # 2,0% so market (vi market dong ngay tieng coi man cuoc), nen ky vong la 1 lenh
      # khop moi 32 ngay. Moi muc tren 0.01 do duoc deu phang hoac am, nen muc gia cho
      # bong da tach rieng va khong bao gio dung chung voi esports.

      # Contract ky lenh (EIP-712 verifyingContract). Mac dinh = clob-client 5.8.1.
      # Polymarket dang chuyen sang rails pUSD voi contract moi; de o day de doi
      # duoc bang bien moi truong thay vi phai build lai.
      Polymarket__ExchangeAddress:        "${POLY_EXCHANGE_ADDRESS:-0x4bFb41d5B3570DeFd03C39a9A4D8dE6Bd8B8982E}"
      Polymarket__NegRiskExchangeAddress: "${POLY_NEGRISK_EXCHANGE_ADDRESS:-0xC5d563A36AE78145C45a50134d48A1215220f80a}"
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:
