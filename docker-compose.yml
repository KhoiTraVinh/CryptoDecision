name: cryptodecision

services:

  # ── Kafka (KRaft — no ZooKeeper) ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    mem_limit: 512m
    environment:
      KAFKA_HEAP_OPTS:                     "-Xmx256m -Xms128m"
      KAFKA_NODE_ID:                       1
      KAFKA_PROCESS_ROLES:                 broker,controller
      KAFKA_LISTENERS:                     PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:          PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS:      1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:     CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME:    PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:     "false"
      KAFKA_NUM_PARTITIONS:                3
      KAFKA_DEFAULT_REPLICATION_FACTOR:    1
      KAFKA_LOG_RETENTION_HOURS:           72
      KAFKA_LOG_SEGMENT_BYTES:             104857600
      KAFKA_NUM_NETWORK_THREADS:           2
      # 2, not 4. On a 2-vCPU host four IO threads oversubscribe the box and the JVM
      # spends time context-switching rather than doing work. Throughput here is one
      # symbol at ~28 trades/sec, which one thread would carry.
      KAFKA_NUM_IO_THREADS:                2
      # Single-broker: internal topics must use replication-factor=1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:          1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:  1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:             1
      # Persist data in the named volume (not ephemeral /tmp/kafka-logs)
      KAFKA_LOG_DIRS:                      /var/lib/kafka/data
      CLUSTER_ID:                          "CryptoDecisionKraftCluster1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Topic initialization ──────────────────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # command must be a single-element list so Docker Compose does NOT
    # tokenize it — passing a plain string causes it to be word-split and
    # only the first token is used as the -c script (rest become $0, $1…).
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic binance.trade.solusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic binance.kline.1m.solusdt --partitions 1 --replication-factor 1
        --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic predictions.solusdt --partitions 1 --replication-factor 1
        --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic okx.trade.solusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bybit.trade.solusdt --partitions 3 --replication-factor 1
        --config retention.ms=259200000 &&
        echo All Kafka topics created successfully
    restart: "no"

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    # Raised from 768m. Postgres is the workhorse here and the only service whose
    # performance is cache-sensitive; with a 7-day trades window (~2.5 GB) more page
    # cache is the highest-value gigabyte in the budget.
    mem_limit: 1g
    environment:
      # Parameterised so the value in .env is the value in force. It was hardcoded to
      # `crypto` here while db-migrate connected with ${POSTGRES_PASS} from .env — so
      # setting that secret broke the migration with psql exit 2 (connection failed)
      # and changed nothing else, because every other client hardcoded `crypto` too.
      #
      # initdb reads these ONLY when the data volume is empty. Changing the password
      # against an existing volume does not change the database password: the volume
      # has to be recreated, or this set back to what the volume was built with.
      POSTGRES_DB:       "${POSTGRES_DB:-crypto}"
      POSTGRES_USER:     "${POSTGRES_USER:-crypto}"
      POSTGRES_PASSWORD: "${POSTGRES_PASS:-crypto}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c effective_cache_size=512MB
        -c work_mem=2MB
        -c maintenance_work_mem=32MB
        -c checkpoint_completion_target=0.9
        -c wal_level=replica
        -c max_wal_size=1GB
        -c random_page_cost=1.1
        -c track_activity_query_size=2048
        -c log_min_duration_statement=1000
    healthcheck:
      # Interpolated by Compose, not by the container shell. A $-escaped variable
      # here would have to survive two layers of escaping, and it did not — it
      # collapsed to a single $ and Compose resolved it to an empty string, giving
      # `pg_isready -U ""`. That fails, postgres never reports healthy, and every
      # service that waits on it never starts. Same source of truth either way.
      # pg_isready, not a query.
      #
      # It is tempting to make this authenticate — a password mismatch leaves postgres
      # reporting healthy while every client fails to log in, and the first symptom is
      # "container processor is unhealthy" three services downstream. But a healthcheck
      # running inside this container cannot test that: the official image's pg_hba
      # grants `trust` to local-socket and loopback connections, so psql succeeds here
      # whatever the password is. A check that always passes is worse than one with a
      # known blind spot.
      #
      # The credentials are verified where they can be — db-migrate connects over TCP
      # from another container and therefore actually authenticates. See sql/migrate.sh.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto} -d ${POSTGRES_DB:-crypto}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Credential canary ─────────────────────────────────────────────────────
  #
  # Verifies that the configured credentials actually log in, before anything else
  # starts. Depends on postgres alone, so it has no schema prerequisites and cannot
  # be blocked by the services it protects.
  #
  # This exists because the diagnostic was previously unreachable. A password
  # mismatch — the most likely reason the database is unusable, since
  # POSTGRES_PASSWORD only applies to an empty volume — failed first inside
  # ProcessorService, and the operator saw "container processor is unhealthy" with
  # nothing about credentials. The clear message lived in db-migrate, which waits on
  # processor, so it never ran.
  #
  # The postgres healthcheck cannot cover this: the official image grants `trust` to
  # local-socket and loopback connections, so a query run inside that container
  # succeeds whatever the password is. This container connects over TCP.
  db-check:
    image: postgres:16
    container_name: db-check
    mem_limit: 64m
    environment:
      PGHOST:     postgres
      PGPORT:     "5432"
      PGUSER:     "${POSTGRES_USER:-crypto}"
      PGPASSWORD: "${POSTGRES_PASS:-crypto}"
      PGDATABASE: "${POSTGRES_DB:-crypto}"
      SQL_DIR:    /sql
      # Same script as db-migrate, stopping after the credential check. One script so
      # the two cannot disagree about what a working connection is.
      CHECK_ONLY: "1"
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/sh", "/sql/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Schema migrations ─────────────────────────────────────────────────────
  #
  # Applies sql/*.sql in filename order, once each, recorded in schema_migrations.
  #
  # This replaces docker-entrypoint-initdb.d, which could not do the job: Postgres
  # runs that directory only when the data volume is empty, so it never applied
  # anything on an upgrade, and the mount list stopped at 011. Migrations 012-022 —
  # flow_bars_15m, per-trade exit geometry, the entry cap, risk-based sizing, both
  # readiness views — were applied by hand to one machine. A fresh instance would
  # have started, reported healthy, and abstained forever against a table that did
  # not exist.
  #
  # Every service that touches the database waits on this completing successfully.
  db-migrate:
    image: postgres:16
    container_name: db-migrate
    mem_limit: 128m
    environment:
      PGHOST:     postgres
      PGPORT:     "5432"
      PGUSER:     "${POSTGRES_USER:-crypto}"
      PGPASSWORD: "${POSTGRES_PASS:-crypto}"
      PGDATABASE: "${POSTGRES_DB:-crypto}"
      SQL_DIR:    /sql
      # Set to 1 exactly once, against a database already migrated by hand, to record
      # the existing files without re-running them. Never against an empty database —
      # it would produce a ledger claiming a schema that does not exist.
      MIGRATE_BASELINE: "${MIGRATE_BASELINE:-0}"
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/sh", "/sql/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      # Waits for ProcessorService, which owns the base schema.
      #
      # DatabaseInitializer creates trades, klines_1m, daily_feature_table,
      # prediction_table, bot_trades and the bot_config columns, and it runs before
      # host.RunAsync() — so a healthy processor means those tables exist. The sql/
      # files are increments on top of that and several of them (006 onward) alter
      # tables they do not create.
      processor:
        condition: service_healthy
    restart: "no"

  # ── IngestionService ──────────────────────────────────────────────────────────
  ingestion:
    build:
      context: ./src/CryptoDecision.IngestionService
      dockerfile: Dockerfile
    container_name: ingestion
    mem_limit: 256m
    ports:
      - "8081:8080"   # health endpoint
    environment:
      DOTNET_ENVIRONMENT:          Production
      Kafka__BootstrapServers:     kafka:9092
      # Binance uses public stream — no auth needed
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      # Gated on the credential canary so a bad password reports itself instead of
      # surfacing here as an unhealthy container with a stack trace.
      db-check:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── ProcessorService ──────────────────────────────────────────────────────────
  processor:
    build:
      context: ./src/CryptoDecision.ProcessorService
      dockerfile: Dockerfile
    container_name: processor
    mem_limit: 256m
    ports:
      - "8082:8080"   # health endpoint
    environment:
      DOTNET_ENVIRONMENT:              Production
      Kafka__BootstrapServers:         kafka:9092
      ConnectionStrings__Postgres:     "Host=postgres;Port=5432;Database=${POSTGRES_DB:-crypto};Username=${POSTGRES_USER:-crypto};Password=${POSTGRES_PASS:-crypto};Pooling=true;MinPoolSize=5;MaxPoolSize=50;"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── BotService (Trading Bot Worker — always runs, even in headless mode) ────
  bot:
    build:
      context: ./src
      dockerfile: CryptoDecision.BotService/Dockerfile
    container_name: bot
    # Raised from 128m. The process was steady at 92 MB against that cap — 72%, with
    # no headroom for a GC to work in — and stalled with every thread in futex_wait.
    # 256m matches the other .NET services here and is still small; the GC mode was
    # the larger half of that problem and is fixed in the csproj.
    mem_limit: 256m
    environment:
      DOTNET_ENVIRONMENT:              Production
      ConnectionStrings__Postgres:     "Host=postgres;Port=5432;Database=${POSTGRES_DB:-crypto};Username=${POSTGRES_USER:-crypto};Password=${POSTGRES_PASS:-crypto};Pooling=true;MinPoolSize=2;MaxPoolSize=20;"

      # ── OKX live order placement ──
      #
      # Credentials come from the host environment or a .env file and are never
      # written into this file — it is committed, they are not.
      #
      # Okx__EnableLiveTrading is the arm switch and defaults to false, so a
      # deployment that has credentials still cannot place an order until this is
      # deliberately set. bot_config.paper_mode=false is the second, separate
      # switch. Okx__DemoTrading=true routes every order to OKX's simulated
      # account, which is where a new configuration belongs first.
      Okx__ApiKey:                     "${OKX_API_KEY:-}"
      Okx__ApiSecret:                  "${OKX_API_SECRET:-}"
      Okx__Passphrase:                 "${OKX_PASSPHRASE:-}"
      Okx__DemoTrading:                "${OKX_DEMO_TRADING:-true}"
      Okx__EnableLiveTrading:          "${OKX_ENABLE_LIVE_TRADING:-false}"
      Okx__MaxOrderNotionalUsd:        "${OKX_MAX_ORDER_NOTIONAL_USD:-100}"
      Okx__Leverage:                   "${OKX_LEVERAGE:-3}"
      Okx__MarginMode:                 "${OKX_MARGIN_MODE:-isolated}"

      # The same tag the pull and the prediction service use. Stated here rather than
      # left to the code default, which was qwen2.5:7b — and because the availability
      # probe matches only the name before the colon, a 3b-only host would have looked
      # healthy and then refused every entry on a chat call for a missing tag.
      Agent__Model:                    "${OLLAMA_MODEL:-qwen2.5:3b}"

    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api:
    build:
      context: ./src
      dockerfile: CryptoDecision.ApiService/Dockerfile
    container_name: api
    mem_limit: 256m
    profiles: ["ui"]
    ports:
      - "8080:8080"   # HTTP (health + Swagger)
    environment:
      ASPNETCORE_ENVIRONMENT:          Production
      ConnectionStrings__Postgres:     "Host=postgres;Port=5432;Database=${POSTGRES_DB:-crypto};Username=${POSTGRES_USER:-crypto};Password=${POSTGRES_PASS:-crypto};Pooling=true;MinPoolSize=2;MaxPoolSize=30;"
      Kafka__BootstrapServers:         kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Ollama — local LLM runtime serving Qwen 2.5 7B ────────────────────────
  #
  # Resource note: qwen2.5:3b at Q4_K_M is ~1.9 GB on
  # disk and wants roughly 6-8 GB of RAM resident while loaded. mem_limit is set
  # above that with headroom for the KV cache; lowering it will get the model
  # OOM-killed mid-generation rather than making it run leaner. If the host
  # cannot spare that, set OLLAMA_ENABLED=false on the prediction service and the
  # ensemble runs on the quantitative models alone.
  #
  # GPU: uncomment the deploy block below on a machine with an NVIDIA GPU and the
  # container toolkit installed. On CPU a generation takes ~20-60s, which is fine
  # against a 5-minute prediction interval.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    # 6g, not 10g. Docker on this host has 8.3 GB total, so a 10 GB limit was not a
    # limit at all — it exceeded the VM, so the kernel OOM killer decided the outcome
    # instead of Docker, and what it reaches for is whatever is largest at the time.
    # That is how Docker Desktop was killed here before. 3g holds qwen2.5:3b (1.9 GB on
    # disk) with context headroom and leaves the rest of the stack, which measures
    # under 900 MB in total, comfortably clear.
    # 3 GB for qwen2.5:3b (~1.9 GB of weights plus KV cache at 8k context).
    mem_limit: 3g
    environment:
      # Keep the model resident between prediction cycles. The default 5m would
      # unload it between runs and pay the multi-second load cost every time.
      # Never unload. With ~4 gate calls a day, a 30-minute keep-alive meant almost
      # every call paid the cold load — 15-18s on 2 Graviton cores, against a 90s
      # cycle deadline. Holding 1.9 GB resident is the cheaper trade on an 8 GB box.
      OLLAMA_KEEP_ALIVE:        "-1"
      # Match the physical core count. Left unset, Ollama sizes its thread pool from
      # nproc and oversubscribes a 2-core instance.
      OLLAMA_NUM_THREAD:        "2"
      # One model, one request at a time — bounds peak memory predictably.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL:      "1"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      # `ollama list` talks to the local API, so it proves the server is serving.
      # The image has no wget/curl, so an HTTP probe is not available here.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── One-shot model pull ───────────────────────────────────────────────────
  # Pulls the configured model into the shared volume on first boot and exits.
  #
  # The tag comes from .env so this pull, the prediction service and the bot agent
  # cannot disagree about it. They could before: the bot defaulted to qwen2.5:7b in
  # code with no env override, while OllamaAgentClient.IsAvailableAsync matches on the
  # name before the colon — so on a host with only 3b pulled it would report the model
  # available and then fail the actual chat call on a tag that does not exist. That
  # surfaces as the gate refusing every entry, with a log line about JSON parsing.
  # Nothing blocks on it: the prediction service degrades to quantitative-only
  # while the pull runs and picks the LLM up automatically once it lands.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    # Single-element list so Compose does not word-split the script — same
    # reasoning as kafka-init above.
    command:
      - >-
        ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ollama_models:/root/.ollama
    restart: "no"

  # ── PredictionService ─────────────────────────────────────────────────────
  prediction:
    build:
      context: ./src/CryptoDecision.PredictionService
      dockerfile: Dockerfile
    container_name: prediction
    # Off by default. With XVENUE_FLOW active nothing reads prediction_table: the
    # strategy scores cross-venue flow directly and the entry gate calls Ollama
    # itself. Kept in the file, behind a profile, because the ensemble is still the
    # reference implementation of the daily-horizon model — not running it and
    # deleting it are separate decisions.
    profiles: ["ensemble"]
    # Raised from 128m: the service now builds richer market contexts and holds
    # prompt/response strings. Inference itself lives in the ollama container.
    mem_limit: 256m
    ports:
      - "8083:8080"   # health endpoint
    environment:
      POSTGRES_URL:             "postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASS:-crypto}@postgres:5432/${POSTGRES_DB:-crypto}"
      KAFKA_BOOTSTRAP_SERVERS:  "kafka:9092"
      SYMBOLS:                  "SOLUSDT"
      # 150s, down from 300s. The bot evaluates every 30s, so at 300s it read the
      # same AI direction for ten consecutive cycles. The floor here is LLM
      # latency, not preference: Qwen 2.5-7B on CPU has been measured at 47-77s
      # per generation, so a cycle much under ~150s would spend most of itself
      # waiting and the scheduler would simply run late.
      PREDICTION_INTERVAL_SECONDS: "150"
      CONTEXT_HISTORY_DAYS:     "7"

      # ── LLM (Ollama / Qwen 2.5) ──
      # Set OLLAMA_ENABLED=false to run the ensemble on XGBoost + heuristic only.
      OLLAMA_ENABLED:           "true"
      OLLAMA_BASE_URL:          "http://ollama:11434"
      OLLAMA_MODEL:             "${OLLAMA_MODEL:-qwen2.5:3b}"
      OLLAMA_TIMEOUT_SECONDS:   "120"
      OLLAMA_TEMPERATURE:       "0.2"
      OLLAMA_NUM_CTX:           "8192"
      OLLAMA_SEED:              "42"

      # ── Ensemble weights (renormalised over whichever models answer) ──
      ENSEMBLE_WEIGHT_LLM:       "0.35"
      ENSEMBLE_WEIGHT_XGBOOST:   "0.35"
      ENSEMBLE_WEIGHT_HEURISTIC: "0.30"
      # |score| below this is reported NEUTRAL rather than a weak directional call.
      ENSEMBLE_DEAD_ZONE:        "0.15"
      # Ceiling on one model's share of the vote after abstentions renormalise
      # away. xgboost abstains until it has a trained model.pkl, and without this
      # the renormalisation handed the LLM 0.538 — a single 7B model outvoting
      # everything else. Binds only while models are missing; the full three-way
      # split tops out at 0.35 and lifts the cap on its own.
      ENSEMBLE_MAX_SINGLE_WEIGHT: "0.50"
    volumes:
      - prediction_models:/app/models
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      # Deliberately service_started, not service_healthy: predictions should not
      # wait on a multi-gigabyte model pull. The LLM joins the ensemble on its own
      # once it answers an availability probe.
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Dashboard (nginx static + API proxy) ──────────────────────────────────
  dashboard:
    image: nginx:1.25-alpine
    container_name: dashboard
    profiles: ["ui"]
    ports:
      - "8888:80"
    volumes:
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/style.css:/usr/share/nginx/html/style.css:ro
      - ./dashboard/app.js:/usr/share/nginx/html/app.js:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  kafka_data:
  postgres_data:
  prediction_models:
  # Holds the downloaded Qwen 2.5 weights (~4.7 GB). Persisting this across
  # `docker compose down` is what keeps the re-pull from happening every restart.
  ollama_models:
