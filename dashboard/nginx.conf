server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets — return 404 for missing files (no SPA fallback for assets)
    location ~* \.(js|css|png|jpg|ico|apk)$ {
        try_files $uri =404;
    }

    # SPA fallback only for navigation requests (no file extension)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend — avoids CORS entirely
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Proxy SignalR WebSocket hub — required for mobile app
    location /hubs/ {
        proxy_pass         http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # APK download (Android install file)
    location /app.apk {
        add_header Content-Disposition "attachment; filename=CryptoDecision.apk";
        add_header Content-Type "application/vnd.android.package-archive";
    }

    # Health endpoint for dashboard container
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
