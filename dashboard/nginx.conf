server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets — return 404 for missing files (no SPA fallback for assets)
    # app.js and style.css are the app shell and carry no version in their names,
    # so a browser holding a cached copy runs yesterday's code against today's API.
    # That is not theoretical: after trading moved to SOL a cached app.js kept
    # requesting BTCUSDT, every market endpoint answered 400, and the dashboard
    # showed empty panels with nothing in the UI to suggest why.
    #
    # must-revalidate rather than no-store: the browser may keep the file, but it
    # has to ask whether it is still current, and nginx answers with a 304 when it
    # is. Cheap, and it makes a redeploy take effect on reload.
    location ~* ^/(app\.js|style\.css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|ico|apk)$ {
        try_files $uri =404;
    }

    # SPA fallback only for navigation requests (no file extension)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend — avoids CORS entirely
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Proxy SignalR WebSocket hub — live push to the dashboard
    location /hubs/ {
        proxy_pass         http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health endpoint for dashboard container
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
