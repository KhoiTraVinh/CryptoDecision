# ─────────────────────────────────────────────────────────────────────────────
# Build service images, push to GHCR, deploy to the server at home.
#
# The target moved off EC2 on 2026-10-22. It is now a 28-core / 15 GB machine on the
# operator's own network, reached over Tailscale because it sits behind residential
# NAT on a private address with a dynamic public IP -- a GitHub-hosted runner can
# route to neither, and forwarding SSH to the internet on an address the ISP rotates
# was not worth it.
#
# Images are still built here and pulled there, but the original reason is gone: the
# old instance had two cores that were fully occupied keeping three WebSocket feeds
# ingesting, so a build on the host cost ingestion data. The new box builds all four
# services in a couple of minutes with the stack running. Building in CI is now a
# choice about where rollback lives -- IMAGE_TAG points at a commit SHA and every tag
# stays in GHCR -- rather than a constraint. A self-hosted runner building on the box
# would also work and would delete most of this file.
#
# Architecture comes from the BUILD_PLATFORM variable (see env below). The .NET
# Dockerfiles cross-compile via $TARGETARCH, so an arm64 target builds natively on the
# x86 runner instead of under QEMU — which matters, because emulating the Roslyn
# compiler turned a two-minute build into twenty, per service.
#
# PredictionService is deliberately not built. It sits behind the `ensemble` compose
# profile and nothing reads prediction_table while XVENUE_FLOW is the active strategy;
# its Python wheels (numpy, xgboost, scikit-learn) have no arm64 manylinux builds for
# every version pinned, so it would be the one thing here that genuinely needs QEMU.
# Add it to the matrix when the ensemble is switched back on.
# ─────────────────────────────────────────────────────────────────────────────
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build and push images without deploying"
        type: boolean
        default: false

concurrency:
  # One deploy at a time. Two overlapping runs would race on `docker compose up -d`
  # and could leave half the stack on one image tag and half on another.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

  # Target architecture, as a repository variable so switching instance families is a
  # settings change rather than a code edit.
  #
  # Defaults to amd64 because the deployed instance is x86_64 — and because GitHub's
  # runners are x86 too, so amd64 needs no cross-compilation and no QEMU at all. The
  # Dockerfiles read $TARGETARCH, so they build correctly for either value with no
  # edit; set BUILD_PLATFORM=linux/arm64 if the instance is ever moved to Graviton.
  #
  # Getting this wrong is not subtle but it is late: the images push fine and the
  # instance fails to start them with "exec format error".
  PLATFORM: ${{ vars.BUILD_PLATFORM || 'linux/amd64' }}

  # Fallback only. Each job recomputes this lowercased into $GITHUB_ENV, because GHCR
  # rejects uppercase in a repository path and GitHub owner names are routinely mixed
  # case — and Actions expressions have no lower() function to do it inline.
  #
  # Recomputed per job rather than passed as a job output: a matrix job's `outputs` are
  # written by whichever leg finishes last, which is the wrong mechanism for a value
  # every leg derives identically.
  REGISTRY_PATH: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: ingestion
            context: ./src/CryptoDecision.IngestionService
            dockerfile: ./src/CryptoDecision.IngestionService/Dockerfile
          - service: processor
            context: ./src/CryptoDecision.ProcessorService
            dockerfile: ./src/CryptoDecision.ProcessorService/Dockerfile
          - service: bot
            context: ./src
            dockerfile: ./src/CryptoDecision.BotService/Dockerfile
          - service: polymarket
            context: ./src
            dockerfile: ./src/CryptoDecision.PolymarketService/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the registry path
        run: |
          echo "REGISTRY_PATH=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"


      # Only does anything when PLATFORM differs from the runner. On amd64 it is a
      # no-op; kept so switching BUILD_PLATFORM to arm64 needs no edit here.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORM }}
          push: true
          # Links the package to this repository in GHCR.
          #
          # Without it a newly pushed image lands as a standalone private package with
          # no repo association, and a repository-scoped token cannot read it back —
          # which surfaces on the instance as `docker login` succeeding and the pull
          # failing, or as a bare "denied: denied". This label is what makes GHCR treat
          # the package as belonging to the repo, so GITHUB_TOKEN can read it.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Both tags: the SHA is what gets deployed and what a rollback points at,
          # `latest` exists so a hand-run `up -d` on the instance still resolves.
          tags: |
            ${{ env.REGISTRY_PATH }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY_PATH }}/${{ matrix.service }}:latest
          # Registry-backed cache rather than gha: the .NET restore layer is large and
          # the gha cache evicts aggressively at 10 GB across all keys.
          cache-from: type=registry,ref=${{ env.REGISTRY_PATH }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_PATH }}/${{ matrix.service }}:buildcache,mode=max

  deploy:
    needs: build
    if: ${{ !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Grants GITHUB_TOKEN pull rights on the packages the build job just pushed,
      # which is what removes the need for a hand-made PAT.
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the registry path
        run: |
          echo "REGISTRY_PATH=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"


      # Joins the tailnet before anything tries to reach the host.
      #
      # The deploy target moved off EC2 to a machine at home: private 192.168 address
      # behind residential NAT, and a dynamic public IP. A GitHub-hosted runner can
      # route to neither, and forwarding SSH to the internet on an address the ISP
      # rotates is the wrong trade. The tailnet gives the host one stable address
      # without opening a port on the router.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Open SSH to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          # Pinned rather than StrictHostKeyChecking=no. Accepting any key on every run
          # is how a deploy pipeline gets pointed at someone else's host.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Only what the host actually needs: the two compose files and sql/, which
      # db-migrate mounts. Source code is not shipped — the images carry it.
      - name: Sync compose files and migrations
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$USER@$HOST" 'mkdir -p ~/cryptodecision'
          # No --delete on this one. The destination is ~/cryptodecision itself, which
          # is also where the hand-managed .env lives -- the file this workflow no
          # longer writes and cannot regenerate. rsync only applies --delete to
          # directories it is actually transferring, so with two file sources it should
          # be inert, but "should be" is not what you want standing between a deploy
          # and the only copy of the live trading credentials.
          rsync -az \
            -e "ssh -i $HOME/.ssh/deploy.pem" \
            docker-compose.yml docker-compose.prod.yml \
            "$USER@$HOST:~/cryptodecision/"
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/deploy.pem" \
            sql/ "$USER@$HOST:~/cryptodecision/sql/"
          # Operator tooling, so `health.sh` is on the host without an scp by hand.
          rsync -az --delete --chmod=F755 \
            -e "ssh -i $HOME/.ssh/deploy.pem" \
            scripts/ "$USER@$HOST:~/cryptodecision/scripts/"


      # .env is NOT written here any more; it is hand-managed on the host.
      #
      # It used to be generated from repository secrets and vars on every deploy, which
      # was safe while Polymarket was geo-blocked in the EC2 region and placed nothing:
      # its POLY_* values were inert text. On the machine at home that service trades
      # for real, so regenerating .env would silently overwrite measured, live tuning
      # with whatever the repository variables happen to hold -- POLY_STAKE_USD 0.06
      # against the 0.10 actually running, and so on. The host's copy is the source of
      # truth now; add a new secret by editing it there.
      #
      # IMAGE_REGISTRY and IMAGE_TAG travelled in that generated file, so they are
      # passed through the ssh environment instead. docker compose resolves variables
      # from the shell environment before .env, so this keeps the prod overlay working
      # without the workflow touching the file.
      - name: Pull and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_REGISTRY: ${{ env.REGISTRY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
          GH_USER: ${{ github.actor }}
          # GITHUB_TOKEN, not a PAT. It is scoped to this repository, expires when the
          # job ends, and needs no manual setup — so there is no long-lived credential
          # sitting on the instance and nothing to rotate. A classic PAT with
          # read:packages still works if you ever need one: swap this line for
          # secrets.GHCR_READ_TOKEN.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$USER@$HOST" \
            "GH_USER='$GH_USER' GH_TOKEN='$GH_TOKEN' \
             IMAGE_REGISTRY='$IMAGE_REGISTRY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/cryptodecision

          # Checked explicitly. An empty token makes docker report a bare
          # "denied: denied" with nothing about the cause, which is a poor way to spend
          # a debugging session.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "registry token is empty — check the deploy job's packages:read permission" >&2
            exit 1
          fi

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          $COMPOSE pull --quiet

          # db-migrate is recreated explicitly, before everything else.
          #
          # `up -d` will not re-run a one-shot container that already exists and has
          # exited, when its image and config are unchanged -- and db-migrate's image
          # is plain postgres:16, so it never changes. A failed migration therefore
          # stays failed across every subsequent deploy, however thoroughly the SQL
          # has been fixed in between.
          #
          # That is not a cosmetic red container. bot declares
          # `depends_on: db-migrate: condition: service_completed_successfully`, so
          # while the stale exit code is 1 the bot is created and never started, while
          # `up -d` reports success and every other service comes up healthy. It
          # happened on 2026-09-08: a migration edited in place failed its checksum,
          # the fix deployed, and the bot sat in Created for 26 minutes of a paper test
          # with nothing anywhere saying so.
          #
          # Migrations are idempotent and the ledger skips what is already applied, so
          # re-running costs a second and removes the whole failure mode.
          $COMPOSE up -d --no-build --force-recreate --no-deps db-migrate
          $COMPOSE wait db-migrate || {
            echo "db-migrate failed -- schema is not at the expected version." >&2
            docker logs db-migrate 2>&1 | tail -20 >&2
            exit 1
          }

          # --no-build keeps a fallback to compiling on the host an error. The host can
          # now build fine, which is exactly why this stays: a silent local build would
          # deploy whatever source happens to sit in ~/cryptodecision instead of the
          # commit that was just pushed, and the two are not the same thing.
          $COMPOSE up -d --no-build --remove-orphans

          # Reclaim superseded images. Needs -a: without it prune only removes
          # DANGLING images, and every image this pipeline pushes carries a commit-SHA
          # tag, so none of them are ever dangling. Combined with until=168h — which
          # excluded everything younger than a week, i.e. all of them — the step ran
          # clean on every deploy and reclaimed nothing. Sixteen images and 11 GB
          # accumulated behind a line that read as if it were housekeeping.
          #
          # until=24h keeps the day's images so a same-day rollback stays instant;
          # anything older re-pulls from GHCR, which still has every tag.
          docker image prune -af --filter 'until=24h'

          # NOT piped to head. `docker system df | head -2` closes the pipe after two
          # lines, docker takes SIGPIPE, and because this is the last command in the
          # heredoc its 141 became the exit code of the whole deploy step — a red run
          # after every real step had already succeeded. Five lines in the log is
          # cheaper than a failure that has to be diagnosed before it can be ignored,
          # and a deploy that cries wolf is a deploy nobody reads.
          #
          # Same SIGPIPE-under-a-pipe mistake that health.sh carries a comment about.
          # Writing that comment did not stop me making it again two commits later.
          docker system df
          REMOTE

      - name: Verify the stack came up
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          # Needed here too, not just in the deploy step. Every $COMPOSE call below
          # reads docker-compose.prod.yml, which declares ${IMAGE_REGISTRY:?...} -- so
          # without it `config --services` aborts and the verify step fails a deploy
          # that actually succeeded.
          IMAGE_REGISTRY: ${{ env.REGISTRY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$USER@$HOST" \
            "IMAGE_REGISTRY='$IMAGE_REGISTRY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/cryptodecision

          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          # Give the health checks their start_period before judging anything.
          sleep 90

          docker ps --format 'table {{.Names}}\t{{.Status}}'

          # A positive assertion over the services compose is actually managing, rather
          # than a count of exited containers.
          #
          # Two earlier versions of this check were wrong in opposite directions. Naming
          # the one-shots to exclude ('db-migrate|kafka-init|ollama-init') meant adding
          # db-check failed a deploy where all 24 migrations applied and every container
          # was healthy. Counting non-zero exits instead picked up containers that had
          # crashed days earlier and were never cleaned up, so it would start failing on
          # its own.
          #
          # The service list comes from compose, so profiles are respected and it cannot
          # fall behind the file. Each service passes if it is running and not unhealthy,
          # or if it exited 0 — which is success for a one-shot and failure for nothing.
          failed=0
          for svc in $($COMPOSE config --services); do
            # awk rather than `head -1`: awk reads to EOF, head closes the pipe on the
            # first line. Every service happens to have exactly one container today so
            # head never truncates, but the moment one has two, compose takes SIGPIPE
            # and `set -euo pipefail` fails the verify step for a cosmetic reason —
            # which is how the prune line failed a deploy an hour ago.
            cid=$($COMPOSE ps -aq "$svc" 2>/dev/null | awk 'NR==1')

            if [ -z "$cid" ]; then
              # Not started at all: a profile-gated service. Nothing to assert.
              continue
            fi

            state=$(docker inspect "$cid" --format '{{.State.Status}}')
            code=$(docker inspect "$cid" --format '{{.State.ExitCode}}')
            health=$(docker inspect "$cid" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')

            case "$state" in
              running)
                if [ "$health" = "unhealthy" ]; then
                  echo "::error::$svc is running but unhealthy"
                  failed=1
                fi
                ;;
              exited)
                if [ "$code" != "0" ]; then
                  echo "::error::$svc exited $code"
                  failed=1
                fi
                ;;
              *)
                echo "::error::$svc is in state '$state'"
                failed=1
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            $COMPOSE logs --tail=40
            exit 1
          fi

          echo "migration ledger:"
          docker exec postgres psql -U "${POSTGRES_USER:-crypto}" -d "${POSTGRES_DB:-crypto}" -c \
            'SELECT count(*) AS applied, max(applied_at) AS latest FROM schema_migrations'
          REMOTE
